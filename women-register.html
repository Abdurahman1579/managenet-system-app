<!doctype html>
<html lang="om" dir="ltr">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Galmee Seektara Dubartootaa - M.M.D.I K/Malkaa Noonnoo</title>
    <style>
      :root {
        --primary: #1b4332;
        --primary-light: #2d6a4f;
        --accent: #d4a373;
        --bg-color: #f8f9fa;
        --card-bg: #ffffff;
        --text-color: #2b2b2b;
        --text-muted: #6c757d;
        --border-color: #dee2e6;
        --shadow: 0 4px 6px rgba(0, 0, 0, 0.05);
      }
      * {
        box-sizing: border-box;
        margin: 0;
        padding: 0;
        font-family: "Segoe UI", Tahoma, Geneva, Verdana, sans-serif;
      }
      body {
        background-color: var(--bg-color);
        color: var(--text-color);
        line-height: 1.6;
      }
      .navbar {
        background: var(--primary);
        color: white;
        padding: 1rem 2rem;
        display: flex;
        justify-content: space-between;
        align-items: center;
      }
      .nav-brand h2 {
        font-size: 1rem;
        margin: 0;
      }
      .nav-links a {
        color: white;
        text-decoration: none;
        font-weight: 600;
        font-size: 0.9rem;
        padding: 0.4rem 0.8rem;
        border-radius: 6px;
      }
      .container {
        max-width: 700px;
        margin: 2.5rem auto;
        padding: 0 1rem;
      }
      .form-card {
        background: var(--card-bg);
        padding: 2.5rem;
        border-radius: 12px;
        box-shadow: var(--shadow);
        border-top: 5px solid var(--accent);
      }
      .form-card h1 {
        color: var(--primary);
        font-size: 1.5rem;
        margin-bottom: 0.2rem;
      }
      .form-card .am-title {
        color: var(--primary-light);
        font-size: 1.1rem;
        font-weight: 600;
        margin-bottom: 1.5rem;
      }
      .form-group {
        margin-bottom: 1.2rem;
      }
      .form-group label {
        display: block;
        font-weight: 600;
        margin-bottom: 0.4rem;
        font-size: 0.95rem;
      }
      .form-group input,
      .form-group select {
        width: 100%;
        padding: 0.75rem;
        border: 1px solid var(--border-color);
        border-radius: 6px;
        font-size: 1rem;
        outline: none;
      }
      .form-group input:focus,
      .form-group select:focus {
        border-color: var(--primary);
      }
      .submit-btn {
        background: var(--primary);
        color: white;
        border: none;
        width: 100%;
        padding: 0.85rem;
        font-size: 1rem;
        font-weight: 600;
        border-radius: 6px;
        cursor: pointer;
        margin-top: 1rem;
      }
      .submit-btn:hover {
        background: var(--primary-light);
      }
      .back-link {
        display: inline-block;
        margin-top: 1.5rem;
        color: var(--primary);
        text-decoration: none;
        font-weight: 600;
      }
      footer {
        text-align: center;
        margin-top: 3rem;
        padding: 1.5rem;
        color: var(--text-muted);
        font-size: 0.85rem;
        border-top: 1px solid var(--border-color);
      }
    </style>
  </head>
  <body>
    <nav class="navbar">
      <div class="nav-brand"><h2>M.M.D.I K/Malkaa Noonnoo</h2></div>
      <div class="nav-links">
        <a href="sector-index.html">Muummee (ዋና ገፅ)</a>
      </div>
    </nav>

    <div class="container">
      <div class="form-card">
        <h1>Galmee Seektara Dubartootaa</h1>
        <div class="am-title">የመልካ ኖኖ ክ/ከተማ እስልምና ጉዳዮች የሴቶች መረጃ መሰብሰቢያ ቅጽ</div>

        <form id="womenRegisterForm">
          <div class="form-group">
            <label>Maqaa Guutuu / ሙሉ ስም</label>
            <input
              type="text"
              id="full_name"
              placeholder="Maqaa keessan guutuu"
              required
            />
          </div>

          <div class="form-group">
            <label>Umrii / እድሜ</label>
            <input type="number" id="age" placeholder="Fkn: 25" required />
          </div>

          <div class="form-group">
            <label>Lakkoofsa Bilbilaa / ስልክ ቁጥር</label>
            <input type="tel" id="phone" placeholder="09xxxxxxxx" required />
          </div>

          <div class="form-group">
            <label>Iddoo Dhalootaa / የተወለዱበት ቦታ</label>
            <input
              type="text"
              id="birth_place"
              placeholder="Iddoo dhalootaa barreessaa"
              required
            />
          </div>

          <div class="form-group">
            <label>Bara Dhalootaa / የትውልድ ዓመት</label>
            <input
              type="text"
              id="birth_year"
              placeholder="Fkn: 1995"
              required
            />
          </div>

          <div class="form-group">
            <label>Haala Bultii / የጋብቻ ሁኔታ</label>
            <select id="marital_status" required>
              <option value="">Filadhu / ይምረጡ</option>
              <option value="Kan Heerumte / ያገባች">Kan Heerumte / ያገባች</option>
              <option value="Kan Hin Heerumne / ያላገባች">
                Kan Hin Heerumne / ያላገባች
              </option>
              <option value="Kan Hiikamte / የፈታች">Kan Hiikamte / የፈታች</option>
              <option value="Kan Abbaan Manaa Irraa Du'e / ባል የሞተባት">
                Kan Abbaan Manaa Irraa Du'e / ባል የሞተባት
              </option>
            </select>
          </div>

          <div class="form-group">
            <label>Aanaa Amma Keessa Jiraatan / የሚኖሩበት ወረዳ</label>
            <input
              type="text"
              id="wereda"
              placeholder="Maqaa aanaa barreessaa"
              required
            />
          </div>

          <div class="form-group">
            <label>Ganda / Gooxii / ቀበሌ / ጎጥ</label>
            <input
              type="text"
              id="gooxii"
              placeholder="Ganda ykn Gooxii barreessaa"
              required
            />
          </div>

          <div class="form-group">
            <label
              >Masjiida Naannoo keessanitti Argamu / አጠገብዎ የሚገኘው መስጂድ</label
            >
            <input
              type="text"
              id="masjid_name"
              placeholder="Maqaa masjiidaa barreessaa"
              required
            />
          </div>

          <div class="form-group">
            <label>Barnoota Ammayyaa / ዘመናዊ ትምህርት ደረጃ</label>
            <select id="modern_education" required>
              <option value="">Filadhu / ይምረጡ</option>
              <option value="Sadarkaa Tokkoffaa (Primary) / የመጀመሪያ ደረጃ">
                Sadarkaa Tokkoffaa (Primary) / የመጀመሪያ ደረጃ
              </option>
              <option value="Sadarkaa Lammaffaa (Secondary) / ሁለተኛ ደረጃ">
                Sadarkaa Lammaffaa (Secondary) / ሁለተኛ ደረጃ
              </option>
              <option value="Teeknikaanii fi Ogummaa (TVET) / ቴክኒክ እና ሙያ">
                Teeknikaanii fi Ogummaa (TVET) / ቴክኒክ እና ሙያ
              </option>
              <option value="Diplomaa / ዲፕሎማ">Diplomaa / ዲፕሎማ</option>
              <option value="Digirii / Degree / ዲግሪ">
                Digirii / Degree / ዲግሪ
              </option>
              <option value="Maastarsii / Masters / ማስተርስ">
                Maastarsii / Masters / ማስተርስ
              </option>
              <option value="PhD / ፒኤችዲ">PhD / ፒኤችዲ</option>
            </select>
          </div>

          <div class="form-group">
            <label>Sadarkaa Barnoota Diinii / የዲን ትምህርት ደረጃ</label>
            <select id="religious_education" required>
              <option value="">Filadhu / ይምረጡ</option>
              <option value="Jalqaba / Basic / መሰረታዊ">
                Jalqaba / Basic / መሰረታዊ
              </option>
              <option value="Qur'aana / Quran / ቁርአን">
                Qur'aana / Quran / ቁርአን
              </option>
              <option value="Dipiloomaa / ዲፕሎማ">Dipiloomaa / ዲፕሎማ</option>
              <option value="Digirii / ዲግሪ">Digirii / ዲግሪ</option>
              <option value="Maastarsii / ማስተርስ">Maastarsii / ማስተርስ</option>
              <option value="PhD / ፒኤችዲ">PhD / ፒኤችዲ</option>
            </select>
          </div>

          <div class="form-group">
            <label>Hojii / የስራ ዓይነት</label>
            <input
              type="text"
              id="employment"
              placeholder="Fkn: Hoogganaa, Hojjataa, Dhuunfaan..."
              required
            />
          </div>

          <div class="form-group">
            <label>Miseensummaa Seektara Dubartootaa / የሴቶች ዘርፍ አባል መሆን</label>
            <select id="membership_desire" required>
              <option value="">Filadhu / ይምረጡ</option>
              <option value="Eeyyee / Yes / አዎ">Eeyyee / Yes / አዎ</option>
              <option value="Lakki / No / አይደለም">Lakki / No / አይደለም</option>
            </select>
          </div>

          <div class="form-group">
            <label>Buusii Miseensummaa (Ji'aan) / ወርሃዊ አስተዋጽኦ (ብር)</label>
            <input
              type="number"
              id="monthly_contribution"
              placeholder="Hamma birrii barreessaa"
            />
          </div>

          <button type="submit" class="submit-btn">Galmeessi / ይመዝግቡ</button>
        </form>

        <a href="sector-index.html" class="back-link"
          >&larr; Gara Fuula Muummee Deebi'i / ወደ ዋናው ገፅ ይመርሱ</a
        >
      </div>
    </div>

    <footer>
      <p>&copy; 2026 Mana Marii Dhimmoota Islaamummaa K/Malkaa Noonnoo.</p>
    </footer>

    <!-- Supabase JS CDN -->
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

    <script>
      const SUPABASE_URL = "https://stkabwoyxoakjzklbbsl.supabase.co";
      const SUPABASE_ANON_KEY =
        "sb_publishable_5_OkM5j5WM-ASFpJO4hFkA_D3VXNpEl";

      const _supabase = supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

      document
        .getElementById("womenRegisterForm")
        .addEventListener("submit", async (e) => {
          e.preventDefault();

          const formData = {
            full_name: document.getElementById("full_name").value,
            age: parseInt(document.getElementById("age").value) || 0,
            phone: document.getElementById("phone").value,
            birth_place: document.getElementById("birth_place").value,
            birth_year: document.getElementById("birth_year").value,
            marital_status: document.getElementById("marital_status").value,
            wereda: document.getElementById("wereda").value,
            gooxii: document.getElementById("gooxii").value,
            masjid_name: document.getElementById("masjid_name").value,
            modern_education: document.getElementById("modern_education").value,
            religious_education: document.getElementById("religious_education")
              .value,
            employment: document.getElementById("employment").value,
            membership_desire:
              document.getElementById("membership_desire").value,
            monthly_contribution:
              parseFloat(
                document.getElementById("monthly_contribution").value,
              ) || 0,
          };

          const { data, error } = await _supabase
            .from("women_registers")
            .insert([formData]);

          if (error) {
            alert("Dogoggorri uumame: " + error.message);
          } else {
            alert(
              "Galmeen Seektara Dubartootaa milkaa'inaan galmeeffameera! / ምዝገባው ተሳክቷል!",
            );
            document.getElementById("womenRegisterForm").reset();
          }
        });
    </script>
  </body>
</html>
